# Local PostgreSQL for fik dev. Credentials match apps/api/.env
# (postgres/fik_123_docker_local @ localhost:5432, db "fik"). The volume keeps its original name
# (financeapp-pgdata) so existing local data survives the 2026-10-11 rename.
# Reset from scratch with: pnpm db:reset  (see scripts/db-reset.mjs)
services:
  db:
    image: postgres:16-alpine
    container_name: fik-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: fik_123_docker_local
      POSTGRES_DB: fik
    ports:
      - "5432:5432"
    volumes:
      - financeapp-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fik"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  financeapp-pgdata:
