version: 2
updates:
  # pnpm workspace — apunta a la raíz, Dependabot resuelve todos los workspaces
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      nestjs:
        patterns:
          - "@nestjs/*"
      vite-vitest:
        patterns:
          - "vite"
          - "vitest"
          - "vite-node"
          - "@vitejs/*"
      typescript-eslint:
        patterns:
          - "typescript"
          - "eslint"
          - "@typescript-eslint/*"
          - "eslint-plugin-*"
      react:
        patterns:
          - "react"
          - "react-*"
          - "@types/react*"
          - "i18next" # peer of react-i18next; not covered by the "react-*" pattern
      prisma:
        patterns:
          - "prisma"
          - "@prisma/*"

  # Mantiene actualizadas las GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
