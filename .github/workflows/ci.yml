name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      # Prisma 7's prisma.config.ts resolves DATABASE_URL eagerly for every CLI
      # command (validate, generate, ...), not just ones that touch the DB. It
      # also points at the `postgres` service below, which the api's integration
      # and e2e tiers connect to for real (only `test:unit` runs without a DB).
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      # The e2e tier registers/logs in real users over HTTP, so the auth module
      # needs its secrets. Throwaway values — nothing outside this job ever sees
      # a token signed with them.
      JWT_ACCESS_SECRET: "ci-access-secret"
      JWT_REFRESH_SECRET: "ci-refresh-secret"
      JWT_ACCESS_EXPIRES: "15m"
      JWT_REFRESH_EXPIRES: "7d"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # needed for turbo affected detection

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache Turbo outputs
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - run: pnpm --filter @finance/api exec prisma validate

      - run: pnpm --filter @finance/api exec prisma generate

      # prisma/seed.ts imports @finance/money by its built dist (package.json's
      # "default" condition, since tsx runs it as CJS) — on a fresh checkout/cache
      # miss nothing has built that yet, so the seed step below would fail on
      # "Cannot find module .../dist/index.js" with no explicit build first.
      - name: Build shared packages
        run: pnpm exec turbo run build --filter=@finance/money

      # The integration/e2e tiers query a real database, so the service container
      # needs the schema. `db push` matches the local workflow (this repo has no
      # prisma/migrations folder).
      - name: Push Prisma schema to the test database
        run: pnpm --filter @finance/api exec prisma db push

      # The reference-data specs (countries/currencies/institutions) assert
      # against seeded rows, exactly as a provisioned environment has them.
      # `seedReferenceData` is idempotent; the demo user it also creates is
      # harmless here and each spec scopes itself to its own random userId.
      - name: Seed reference data
        run: pnpm --filter @finance/api prisma:seed

      # Architecture boundaries: web↛api/db, api↛web, packages↛apps (SC-004/SC-007).
      - run: pnpm check:boundaries

      - name: Audit (informational)
        run: pnpm audit || true

      - name: Audit (block on high/critical)
        run: pnpm audit --audit-level=high

      - run: pnpm format:check

      - run: pnpm exec turbo run lint

      # Build shared packages + apps. Turbo only rebuilds what changed; on PRs we
      # scope to the apps affected since origin/main so api/web build independently.
      - run: pnpm exec turbo run typecheck test build --filter="...[origin/main]"
        if: github.event_name == 'pull_request'

      - run: pnpm exec turbo run typecheck test build
        if: github.event_name != 'pull_request'
