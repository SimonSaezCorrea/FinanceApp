name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# The jobs only check out, install, build and test: they never write to the repo, so the
# GITHUB_TOKEN gets read access to the code (and, for `gate`, to the list of previous runs).
permissions:
  contents: read

# Three jobs on three runners, in parallel: the api's database tests no longer share a machine
# with the frontend's (that contention made two jsdom tests time out on 2026-10-11), and the
# slowest job sets the wall time instead of the sum of all of them.
jobs:
  # A push to main of a commit that ALREADY passed CI on dev (the usual "dev → main"
  # fast-forward) is not tested twice: the other jobs are skipped, the run still ends in success
  # and Deploy fires. Any other commit on main (a merge commit, a hotfix) runs everything.
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      tested: ${{ steps.check.outputs.tested }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tested=false
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" = "main" ]; then
            count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&status=success&branch=dev" --jq '.total_count')"
            [ "${count:-0}" -gt 0 ] && tested=true
          fi
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
          echo "Already passed on dev: $tested"

  # Repo-wide checks that need no database and no build.
  checks:
    needs: gate
    if: needs.gate.outputs.tested != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # Node 22: the public site (apps/landing, Astro 7) needs >= 22.12 (spec 031).
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Architecture boundaries: web↛api/db/landing, api↛web/landing, landing↛web/api/db,
      # packages↛apps (SC-004/SC-007, spec 031).
      - run: pnpm check:boundaries

      - name: Audit (informational)
        run: pnpm audit || true
      - name: Audit (block on high/critical)
        run: pnpm audit --audit-level=high

      # Prettier only re-checks files that changed since the cached run.
      - name: Prettier cache
        uses: actions/cache@v6
        with:
          path: node_modules/.cache/prettier
          key: prettier-${{ runner.os }}-${{ github.sha }}
          restore-keys: prettier-${{ runner.os }}-
      - run: pnpm format:check

      - name: Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-checks-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-checks-${{ runner.os }}-
      - run: pnpm exec turbo run lint

  # The api: real PostgreSQL for its integration and e2e tiers.
  api:
    needs: gate
    if: needs.gate.outputs.tested != 'true'
    runs-on: ubuntu-latest
    env:
      # Prisma 7's prisma.config.ts resolves DATABASE_URL eagerly for every CLI
      # command (validate, generate, ...), not just ones that touch the DB. It
      # also points at the `postgres` service below, which the api's integration
      # and e2e tiers connect to for real (only `test:unit` runs without a DB).
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      # The e2e tier registers/logs in real users over HTTP, so the auth module
      # needs its secrets. Throwaway values — nothing outside this job ever sees
      # a token signed with them.
      JWT_ACCESS_SECRET: "ci-access-secret"
      JWT_REFRESH_SECRET: "ci-refresh-secret"
      JWT_ACCESS_EXPIRES: "15m"
      JWT_REFRESH_EXPIRES: "7d"
      # specs/017: the keyset pagination cursor is HMAC-signed; the e2e tier issues
      # and validates real cursors over HTTP, so this needs a real value too.
      CURSOR_SIGNING_SECRET: "ci-cursor-secret"
      # specs/021/022: MFA (TOTP secret encryption + login handshake) and passkey
      # challenges are exercised for real by the integration/e2e tiers.
      MFA_ENCRYPTION_KEY: "2f569ed803c2f4dbd6db9c7bf104d228e3a04e3effe6cc133d1c38ed0e7c7dc8"
      MFA_PENDING_TOKEN_SECRET: "ci-mfa-pending-secret"
      PASSKEY_CHALLENGE_SECRET: "ci-passkey-challenge-secret"
      # compliance-cl: registration (guardian consent) and account deletion HMAC the
      # RUT/DNI with this key, so the e2e tier needs it too.
      IDENTIFIER_HASH_SECRET: "ci-identifier-hash-secret"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-api-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-api-${{ runner.os }}-

      - run: pnpm --filter @finance/api exec prisma validate
      - run: pnpm --filter @finance/api exec prisma generate

      # prisma/seed.ts imports @finance/money by its built dist (package.json's
      # "default" condition, since tsx runs it as CJS) — on a fresh checkout/cache
      # miss nothing has built that yet, so the seed step below would fail on
      # "Cannot find module .../dist/index.js" with no explicit build first.
      - name: Build shared packages
        run: pnpm exec turbo run build --filter=@finance/money

      # The integration/e2e tiers query a real database, so the service container
      # needs the schema: the same migrations production applies.
      - name: Apply Prisma migrations to the test database
        run: pnpm --filter @finance/api exec prisma migrate deploy

      # A schema.prisma change without its migration fails here: the migrated database must
      # match the schema exactly (exit code 2 on any difference).
      - name: Check that the migrations match schema.prisma
        run: pnpm --filter @finance/api exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      # The reference-data specs (countries/currencies/institutions) assert
      # against seeded rows, exactly as a provisioned environment has them.
      # `seedReferenceData` is idempotent; the demo user it also creates is
      # harmless here and each spec scopes itself to its own random userId.
      - name: Seed reference data
        run: pnpm --filter @finance/api prisma:seed

      - run: pnpm exec turbo run typecheck test build --filter=@finance/api

  # Everything else: the app, the public site and the shared packages (no database).
  front:
    needs: gate
    if: needs.gate.outputs.tested != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # needed for turbo affected detection on pull requests
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-front-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-front-${{ runner.os }}-

      # On pull requests only what the change affects since origin/main; on pushes, everything
      # (turbo still skips what its cache already built and tested).
      - run: pnpm exec turbo run typecheck test build --filter="...[origin/main]" --filter='!@finance/api'
        if: github.event_name == 'pull_request'
      - run: pnpm exec turbo run typecheck test build --filter='!@finance/api'
        if: github.event_name != 'pull_request'

      # The public site (spec 031): build it with throwaway public origins and check the static
      # output itself (every page's metadata, hreflang, sitemap/robots, and that no page ships
      # React on arrival). Built here even when a PR didn't touch it, since the shared packages
      # it renders can change under it.
      - name: Public site build output
        env:
          PUBLIC_API_URL: "https://api.example.test"
          PUBLIC_APP_URL: "https://app.example.test"
          PUBLIC_SITE_URL: "https://example.test"
          # The indicator pages (spec 033) build with a fixed set of rates instead of calling an
          # API, and test:build checks that exact value of the day is in the HTML.
          EXCHANGE_RATES_SNAPSHOT: test/fixtures/rates-snapshot.json
        run: |
          pnpm --filter @finance/landing build
          pnpm --filter @finance/landing test:build
