name: Landing rates

# Spec 033: the public site's indicator pages (/es/valor-uf/, /es/dolar-observado/, …) and the home
# block carry the value of the day IN their HTML, read from the API when the site is built. This
# rebuilds and uploads ONLY the public site from `main`, twice a day, after the API's 08:00 and
# 20:00 (Chile) recordings, so what a search engine reads is never more than a day old. The pages
# also refresh themselves in the browser; this is for crawlers.
#
# A separate workflow on purpose: deploy.yml takes its baseline from the run-name of its last
# successful run, and a scheduled landing-only run there would move it past an API/web change that
# hasn't been deployed. It shares deploy.yml's concurrency group, so it never uploads mid-release.
#
# EXCHANGE_RATES_REQUIRED=true: if the API can't be read, the build FAILS and the current site stays
# up (a normal deploy builds without the values instead). Needs the same repo variables and secret
# as deploy.yml's landing job.
run-name: Landing rates ${{ github.sha }}

on:
  schedule:
    # 00:20 and 12:20 UTC = 20:20/08:20 (Chilean summer time) or 21:20/09:20 (winter time).
    - cron: "20 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  WRANGLER: wrangler@4.149.0

jobs:
  landing:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the public site with today's rates
        run: pnpm exec turbo run build --filter=@finance/landing
        env:
          PUBLIC_API_URL: https://api.mifik.cl
          PUBLIC_APP_URL: https://app.mifik.cl
          PUBLIC_SITE_URL: https://mifik.cl
          PUBLIC_CF_WEB_ANALYTICS_TOKEN: ${{ vars.CF_WEB_ANALYTICS_TOKEN }}
          EXCHANGE_RATES_REQUIRED: "true"
      - name: Upload to Cloudflare Pages (fik-landing)
        working-directory: apps/landing
        run: |
          sha="$(git rev-parse HEAD)"
          npx --yes "$WRANGLER" pages deploy dist --project-name=fik-landing --branch=main --commit-hash="$sha" --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
