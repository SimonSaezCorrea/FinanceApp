name: Deploy API

# After CI passes on main (or by hand): build the API image for ARM, push it to ECR and tell the
# EC2 server to run it through AWS Systems Manager. No long-lived AWS keys: GitHub authenticates
# with OIDC and assumes a role that can only push this image and send this one command.
# Third-party actions are pinned to a commit SHA (version in the comment); Dependabot's
# github-actions updates keep them current.
# Inert until the repository variables below exist (see docs/DEPLOY.md):
#   AWS_DEPLOY_ROLE_ARN, AWS_API_INSTANCE_ID
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  AWS_REGION: sa-east-1
  ECR_REPOSITORY: fik-api

jobs:
  deploy:
    # `branches: [main]` above matches a branch NAME — a pull request from a fork whose branch is
    # also called "main" would match it too. Deploy only a CI run that came from a push to main of
    # THIS repository (or a manual run, which needs write access and the production environment).
    if: >-
      vars.AWS_DEPLOY_ROLE_ARN != '' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - id: tag
        run: echo "value=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      # The server is Graviton (ARM): emulate it to build.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.value }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha,scope=fik-api-main
          cache-to: type=gha,scope=fik-api-main,mode=max

      - name: Deploy on the server
        env:
          INSTANCE_ID: ${{ vars.AWS_API_INSTANCE_ID }}
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "fik-api ${TAG}" \
            --parameters "commands=[\"/opt/fik/deploy.sh ${TAG}\"],executionTimeout=[\"900\"]" \
            --query Command.CommandId --output text)"
          echo "SSM command ${command_id}"
          for _ in $(seq 1 120); do
            status="$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)"
            case "$status" in
              Success) break ;;
              Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 10
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query '{status:Status,output:StandardOutputContent,errors:StandardErrorContent}' \
            --output json
          [ "$status" = "Success" ]
