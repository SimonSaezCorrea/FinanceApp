<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the page reach under the notch / home indicator; without it every
         env(safe-area-inset-*) in the CSS resolves to 0. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The theme is chosen in the app (data-theme), not only by the OS, so one tag is kept and
         rewritten to the resolved theme's background: below and in ThemeProvider. -->
    <meta name="theme-color" content="#0b1518" />
    <!-- The app is not for search engines: the public site (apps/landing) is what gets indexed and
         shared (spec 031, FR-019), so no description or Open Graph here. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Cuadra</title>
    <!-- theme-prepaint: replaced at build/dev by vite.config.ts with @finance/ui/prepaint.mjs -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
