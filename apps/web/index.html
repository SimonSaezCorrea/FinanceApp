<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the page reach under the notch / home indicator; without it every
         env(safe-area-inset-*) in the CSS resolves to 0. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The theme is chosen in the app (data-theme), not only by the OS, so one tag is kept and
         rewritten to the resolved theme's background: below and in ThemeProvider. -->
    <meta name="theme-color" content="#0b1518" />
    <meta
      name="description"
      content="Cuadra, la columna de tus finanzas. Cupo, cuotas y facturación como los lleva tu banco."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cuadra" />
    <meta property="og:title" content="Cuadra" />
    <meta
      property="og:description"
      content="Tus finanzas con las reglas de tu banco: cupo compartido, cierre en días hábiles y cuotas."
    />
    <meta property="og:locale" content="es_CL" />
    <meta name="twitter:card" content="summary" />
    <title>Cuadra</title>
    <script>
      // Pre-paint theme application (no flash). Mirrors ThemeProvider resolution.
      (function () {
        try {
          var m = localStorage.getItem("finance.theme") || "dark";
          var resolved =
            m === "system"
              ? matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark"
              : m;
          document.documentElement.dataset.theme = resolved;
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", resolved === "light" ? "#f4f7f8" : "#0b1518");
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
